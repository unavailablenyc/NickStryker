# New host is https://unavailable.nyc/ (apex).
# Live Wix currently 301s the apex to https://www.unavailable.nyc.
# After GoDaddy DNS points here, www should 301 to the apex.
# Old Wix product URLs are mapped to the closest page on this site.
# They are not recreated.

[[redirects]]
  from = "https://www.unavailable.nyc/*"
  to = "https://unavailable.nyc/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/product-page/hood"
  to = "/collection.html#hood"
  status = 301

